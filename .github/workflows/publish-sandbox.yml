name: Publish Sandbox Image

# Manual, sandbox-only image publishing for one exact product commit.
#
# Dispatch this on a ref whose workflow file matches main, supplying the full
# 40-hex commit SHA to publish. The workflow rejects anything that is not a
# lowercase full SHA or is not an ancestor of `main`, checks that exact commit
# out, builds `services/sandbox/Dockerfile` target `sandbox` for linux/amd64
# (the k3s nodes), and pushes only
# `ghcr.io/darkmatter/centaur-agent:sha-<that SHA>`.
#
# Deliberate limits:
# - `workflow_dispatch` only: no push/tag triggers, so merging this file does
#   not rebuild anything by itself.
# - Sandbox image only: the API and the other services are not published here.
# - No `latest` or branch tag: every published tag names the commit it came
#   from, which is what GitOps pins.
# - The job runs only when the repository owner is `darkmatter`, so this never
#   builds or pushes for upstream `paradigmxyz/centaur`.
# - No dispatch to downstream overlays: promotion to an environment is a
#   separate, reviewed GitOps change.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character lowercase commit SHA on main to publish
        required: true
        type: string

concurrency:
  group: publish-sandbox-${{ inputs.source_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/darkmatter/centaur-agent

jobs:
  publish:
    name: Publish centaur-agent
    if: github.repository_owner == 'darkmatter'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Validate source_sha
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character lowercase hex commit SHA, got: $SOURCE_SHA"
            exit 1
          fi
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      # Full history makes the ancestry check below provable locally instead of
      # trusting the ref the workflow was dispatched from.
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source_sha is on main and check it out
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$SOURCE_SHA" HEAD; then
            echo "::error::$SOURCE_SHA is not an ancestor of main; refusing to publish"
            exit 1
          fi
          git checkout --force --detach "$SOURCE_SHA"
          resolved="$(git rev-parse HEAD)"
          if [[ "$resolved" != "$SOURCE_SHA" ]]; then
            echo "::error::checked out $resolved instead of $SOURCE_SHA"
            exit 1
          fi
          echo "::notice::publishing sandbox image for $SOURCE_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.title=centaur-agent
            org.opencontainers.image.source=https://github.com/darkmatter/centaur
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

      - name: Build and push centaur-agent:sha-${{ env.SOURCE_SHA }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/sandbox/Dockerfile
          target: sandbox
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same cache scope the fork's previous sandbox publisher used, so a
          # re-run of this workflow reuses the toolchain layers.
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Inspect published manifest
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:sha-${SOURCE_SHA}"
